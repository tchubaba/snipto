# Cloudflare Authenticated Origin Pulls (AOP) — client-certificate snippet.
#
# This file lives OUTSIDE the repository at runtime: it is loaded by the
# wildcard `include /etc/nginx/aop/*.conf;` inside the server block of
# docker/nginx.conf ONLY when AOP_CERT_DIR is set in .env (when unset, the
# mounted /etc/nginx/aop is an empty directory and the include matches
# nothing — AOP stays disabled).
#
# Flow (zone-level AOP, self-owned CA — nothing is downloaded from Cloudflare;
# the Global tier's Cloudflare-shared certificate is the weaker alternative,
# since any other Cloudflare account can present that same shared cert):
#
#   1. Generate the AOP material yourself — a CA cert + key, then a client
#      cert + key signed by it:
#        openssl req -x509 -newkey rsa:2048 -sha256 -nodes -days 3650 \
#          -keyout aop-ca.key -out aop-ca.crt -subj "/CN=snipto-aop-ca"
#        openssl req -newkey rsa:2048 -sha256 -nodes \
#          -keyout aop-client.key -out aop-client.csr -subj "/CN=snipto-aop"
#        printf '%s\n' 'basicConstraints = CA:FALSE' \
#          'keyUsage = critical, digitalSignature, keyEncipherment' \
#          'extendedKeyUsage = clientAuth' > aop.ext
#        openssl x509 -req -in aop-client.csr -CA aop-ca.crt -CAkey aop-ca.key \
#          -CAcreateserial -out aop-client.crt -days 3650 -sha256 \
#          -extfile aop.ext
#      The clientAuth EKU is what makes aop-client.crt a valid client
#      certificate; `openssl verify -CAfile aop-ca.crt aop-client.crt` must
#      print OK.
#
#   2. In the Cloudflare dashboard for the snipto.net zone: SSL/TLS → Origin
#      Server → Authenticated Origin Pulls (zone-level). UPLOAD aop-client.crt
#      AND aop-client.key FIRST (the upload form takes both the certificate
#      and the private key), THEN flip the zone-level toggle ON. Toggling
#      without an uploaded certificate makes Cloudflare present nothing and
#      every visitor gets 400/525.
#
#   3. Put the CA certificate in this same directory under the exact name
#      nginx expects below:
#            ssl_client_certificate.pem   (= aop-ca.crt)
#      The private keys (aop-ca.key, aop-client.key) are never needed at the
#      origin — keep them in your secret store; only the CA certificate and
#      this aop.conf belong in the AOP directory.
#
#   4. In .env set:  AOP_CERT_DIR=/path/to/this/directory
#   5. docker compose -f docker-compose.prod.yml up -d nginx
#
# What this does: Cloudflare's edge presents the TLS client certificate it
# holds (signed by your CA) on every proxied connection to the origin. nginx
# verifies it against your CA and REJECTS (HTTP 400) every handshake that
# carries no valid certificate — direct origin-IP access dies at the TLS
# layer, independent of the Cloudflare IP allowlist ($cf_trusted), which
# remains as defense-in-depth. Set a Cloudflare notification for AOP
# certificate expiration so renewal is never a surprise.

ssl_client_certificate /etc/nginx/aop/ssl_client_certificate.pem;
ssl_verify_client      on;
