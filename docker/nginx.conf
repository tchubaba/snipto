# Log format — required by crowdsecurity/openresty image (replaces built-in default)
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" "$http_x_forwarded_for"';

server {
    listen 443 ssl;
    http2 on;
    server_name snipto.net;

    # Allow payloads up to 12MB (API enforces 10MB, but base64 encoding inflates the size)
    client_max_body_size 12M;

    # Hide Nginx version from response headers
    server_tokens off;

    # Hide PHP version from response headers
    fastcgi_hide_header X-Powered-By;

    # Restrict HTTP methods
    if ($request_method !~ ^(GET|HEAD|POST|PUT|PATCH|DELETE|OPTIONS)$ ) {
        return 405;
    }

    # Timeouts to mitigate Slowloris attacks
    client_body_timeout 10s;
    client_header_timeout 10s;
    keepalive_timeout 15s;
    send_timeout 10s;

    # Block requests that do not come through Cloudflare
    if ($cf_trusted = 0) {
        return 403;
    }

    # Dual logging: real file for CrowdSec + stdout for docker logs (using custom 'main' format)
    access_log /var/log/nginx/crowdsec.access.log main;
    access_log /dev/stdout main;

    # SSL certificate paths — operator must mount these manually
    ssl_certificate     /etc/nginx/ssl/cert.pem;
    ssl_certificate_key /etc/nginx/ssl/key.pem;

    # Strong TLS configuration
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security headers (Laravel CSP middleware handles additional headers).
    #
    # CLOUDFLARE DASHBOARD NOTE (audit finding F-4): every one of these headers
    # must be emitted by exactly ONE layer. In the Cloudflare dashboard, keep
    # "Strict Strict-Transport-Security" (Security → SSL/TLS → Edge
    # Certificates) OFF and do not inject Referrer-Policy via dashboard rules
    # or the "Security Headers" app — otherwise responses carry duplicate
    # HSTS/Referrer-Policy entries, and browsers honour the FIRST HSTS seen,
    # which was the Cloudflare one (shorter max-age, no preload), silently
    # overriding the intent below.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    root /var/www/html/public;
    index index.php;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static asset caching (Vite-built assets with content hashes).
    #
    # nginx add_header inheritance quirk (audit finding F-4): a location that
    # declares ANY add_header of its own inherits NONE of the server-level
    # headers. Without repeating them here, /build/* and static assets were
    # served with no HSTS, no X-Frame-Options, and — critically for JS/CSS —
    # no X-Content-Type-Options: nosniff. Keep this list in sync with the
    # server-level block above.
    location /build/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    location ~* \.(?:ico|css|js|gif|jpe?g|png|svg|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
        add_header X-Frame-Options DENY always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
        try_files $uri =404;
    }

    # Route Nginx 404s to Laravel
    error_page 404 /index.php;

    # Laravel routing — pass all requests to index.php
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # PHP-FPM processing — only the front controller may be executed. An exact
    # match means a stray .php anywhere in the docroot (a leftover build
    # artifact, an uploaded file) can never reach FPM, whatever its path.
    # fastcgi_index is gone with it: it only applies when a URI maps to a
    # directory, which an exact match makes impossible.
    location = /index.php {
        try_files $uri =404;
        fastcgi_pass app:9000;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;
    }

    # ...and a stray .php must not be served as source either. Without this the
    # request falls through to `location /`, where try_files finds the file and
    # hands the raw PHP source to the client — worse than executing it. The 404
    # is picked up by error_page above and rendered by Laravel.
    location ~* \.php$ {
        return 404;
    }

    # Deny access to hidden files and directories
    location ~ /\.(?!well-known).* {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Deny access to .env and other sensitive files
    location ~ ^/(?:\.env|composer\.(?:json|lock)|package(?:-lock)?\.json) {
        deny all;
    }
}
