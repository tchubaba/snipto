# CI test pipeline: PHPUnit (SQLite in-memory via phpunit.xml) + Playwright E2E
# (four-mode walkthrough incl. Snipto ID generation) against a native PHP 8.5
# app with a MariaDB service container for prod parity (lockForUpdate in the
# reveal path is a no-op on SQLite).
#
# Not covered here (manual matrix): the nginx+CrowdSec prod stack, TLS, and
# privacy browsers (Tor/Mullvad block crypto.subtle X25519 jwk export, which is
# why libsodium is used — behavior there can't be asserted from Chromium).
#
# Actions are pinned by full commit SHA, matching docker-publish.yml.
name: Tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

env:
  PHP_VERSION: '8.5'

jobs:
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-24.04
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: snipto
          MARIADB_USER: snipto
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, zip, exif
          coverage: none

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Raise MariaDB max_allowed_packet for the 50 MiB LONGBLOB test
        # Same story as the e2e job: FileSniptoTest round-trips a real
        # 50 MiB payload, and the service's 16M-class default kills the
        # connection on the insert ('server has gone away'). Server vars
        # cannot ride in the service 'options:' block (see e2e note);
        # SET GLOBAL here, and every test-process session inherits it.
        run: php -r 'new PDO("mysql:host=127.0.0.1;port=3306","root","root")->exec("SET GLOBAL max_allowed_packet=134217728");'

      - name: Run test suite (MariaDB service — matches production and the local
          docker stack; phpunit.xml's SQLite fallback would neuter lockForUpdate)
        run: php artisan test
        env:
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: snipto
          DB_USERNAME: snipto
          DB_PASSWORD: secret

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    needs: phpunit
    services:
      mariadb:
        image: mariadb:lts
        env:
          MARIADB_ROOT_PASSWORD: root
          MARIADB_DATABASE: snipto
          MARIADB_USER: snipto
          MARIADB_PASSWORD: secret
        ports:
          - 3306:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: pdo_mysql, mbstring, bcmath, intl, gd, zip, exif, pcntl
          coverage: none

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm

      - name: Cache Composer vendor
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: vendor
          key: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-${{ hashFiles('composer.lock') }}
          restore-keys: composer-${{ runner.os }}-php${{ env.PHP_VERSION }}-

      - run: composer install --no-interaction --prefer-dist --optimize-autoloader

      - name: Prepare .env (APP_ENV=local keeps the throttle private-range bypass
          active for 127.0.0.1; secure cookies off since CI serves plain HTTP)
        run: |
          cp .env.example .env
          php artisan key:generate --force
          sed -i 's/^DB_HOST=.*/DB_HOST=127.0.0.1/' .env
          sed -i 's/^SESSION_SECURE_COOKIE=.*/SESSION_SECURE_COOKIE=false/' .env

      - run: npm ci

      - name: X25519 peer-key validation test (BigInt ladder vs RFC 7748
          vectors + libsodium cross-check; guards audit finding F-2 code in
          resources/js/snipto.js)
        run: node tests/js/x25519-validation.test.mjs

      - name: File-envelope framing test (build/parse round-trip + rejection
          paths for the file-sharing envelope in resources/js/snipto.js)
        run: node tests/js/file-envelope.test.mjs

      - run: npm run build
      - run: php artisan migrate --force

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: playwright-${{ runner.os }}-

      - run: npx playwright install --with-deps chromium firefox

      - name: Raise PHP upload limits for the 50 MiB file e2e specs
        # Without this, post_max_size=8M (PHP default) makes Laravel's
        # ValidatePostSize middleware reject big PUT bodies before routing —
        # the exact failure found in manual testing (deviation D2).
        # mysql.max_allowed_packet is set explicitly as belt-and-braces;
        # mysqlnd also honors the server-negotiated size at handshake.
        run: |
          SCAN=$(php --ini | awk -F': ' '/Scan for additional/{print $NF}' | tr -d '"')
          printf 'post_max_size = 128M\nmemory_limit = 384M\nmysql.max_allowed_packet = 134217728\n' | sudo tee "$SCAN/99-e2e-uploads.ini" > /dev/null

      - name: Raise MariaDB max_allowed_packet for the 50 MiB LONGBLOB inserts
        # MUST be done here, not via the service 'options:' block: the runner
        # splices options into docker create FLAGS before the image name, so
        # server variables there fail with 'unknown flag' (exit 125) — the
        # container never even started. SET GLOBAL after boot, over PDO,
        # before the app ever connects; new sessions inherit the global.
        run: php -r 'new PDO("mysql:host=127.0.0.1;port=3306","root","root")->exec("SET GLOBAL max_allowed_packet=134217728");'

      - name: Start app
        run: |
          php artisan serve --host=127.0.0.1 --port=8008 > /tmp/serve.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8008/ > /dev/null && exit 0
            sleep 1
          done
            cat /tmp/serve.log
            exit 1

      - run: npx playwright test
        env:
          E2E_BASE_URL: http://127.0.0.1:8008

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
