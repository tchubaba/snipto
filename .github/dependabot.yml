version: 2

# Supply-chain cooldown: a release must be at least 3 days old before
# Dependabot opens a version-update PR for it. Malicious releases are
# usually pulled within hours of publication, so waiting filters them out
# before they ever reach a pull request. Cooldown never applies to security
# updates, which are still opened immediately. Pinned by
# tests/Feature/DependencyCooldownTest.php (composer.json and .npmrc carry
# the matching install-time cooldowns).

# Directory correctness matters: each ecosystem scans only the directories
# listed, and a directory holding no parseable manifest for that ecosystem
# makes the whole update run fail (the docker ecosystem aborts with
# "No Dockerfiles nor Kubernetes YAML found" when pointed at a directory
# without a Dockerfile). The same test pins these paths.

updates:
  # Monitor GitHub Actions for updates
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Monitor Composer (PHP) dependencies
  - package-ecosystem: "composer"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Monitor the base images named in FROM lines of docker/Dockerfile and
  # docker/Dockerfile-fpm (php:8.5-cli, php:8.5-fpm), digest pins included.
  # Only FROM lines are parsed: the COPY --from=composer:... line inside those
  # files is out of reach for this ecosystem and stays a manual bump.
  - package-ecosystem: "docker"
    directories:
      - "/docker"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Monitor the service images in docker-compose.yml and
  # docker-compose.prod.yml (mariadb, crowdsecurity/openresty,
  # crowdsecurity/crowdsec), digest pins included.
  - package-ecosystem: "docker-compose"
    directories:
      - "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  # Monitor npm (frontend) dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
